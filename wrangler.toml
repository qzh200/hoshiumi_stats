# Cloudflare Pages 部署配置
# - `pnpm run deploy` 调用 `wrangler pages deploy`,会处理仓库根的
#   `functions/` 目录(同源 /api/umami/* 代理)并把 dist/ 作为静态资源
# - 这是 Pages 模式:不要加 `[assets]`(那是 Workers + Assets 配置,会
#   让 functions/ 失效,线上 /api/umami/* 全部 404)
name = "hoshiumi-stats"
compatibility_date = "2025-01-01"
pages_build_output_dir = "./dist"
